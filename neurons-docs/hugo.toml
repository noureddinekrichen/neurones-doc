# Neurons documentation — Hugo configuration.
# Build: `hugo --minify` writes the static site to public/. Preview: `hugo server`.

baseURL = "https://docs.confoline.com/neurons/"
# Links and asset URLs in the pages are relative (see layouts/_partials/url.html), so the
# output also works under another prefix; baseURL is used for canonical/hreflang URLs.

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false   # English at /neurons/, French at /neurons/fr/
disableDefaultLanguageRedirect = true    # no extra /neurons/en/ redirect page

# Only the home page of each language is published; the guide parts are assembled into it.
disableKinds = ["section", "taxonomy", "term", "rss", "sitemap", "404"]
enableRobotsTXT = false
disableHugoGeneratorInject = true

[languages.en]
  label = "English"
  contentDir = "content/en"
  weight = 1
  title = "Neurons Docs"
  # Sidebar "Getting Started" categories (can be nested with `parent`). Pages join one with front matter:
  #   menus: { onboarding: { parent: opentelemetry, weight: 10 } }
  [[languages.en.menus.onboarding]]
    identifier = "application-onboarding"
    name = "Application Onboarding"
    weight = 1
  [[languages.en.menus.onboarding]]
    identifier = "opentelemetry"
    parent = "application-onboarding"
    name = "OpenTelemetry"
    weight = 1

[languages.fr]
  label = "Français"
  contentDir = "content/fr"
  weight = 2
  title = "Documentation Neurons"
  [[languages.fr.menus.onboarding]]
    identifier = "application-onboarding"
    name = "Onboarding des applications"
    weight = 1
  [[languages.fr.menus.onboarding]]
    identifier = "opentelemetry"
    parent = "application-onboarding"
    name = "OpenTelemetry"
    weight = 1

[markup.goldmark]
  [markup.goldmark.parser]
    # Only explicit IDs ({#retention}): they are the anchors and must match across languages.
    autoHeadingID = false
    [markup.goldmark.parser.attribute]
      title = true    # ## Heading {#id}
      block = true    # {.steps}, {.ref-note}, table options after a block
  [markup.goldmark.extensions.typographer]
    disable = true    # keep straight quotes, as written
  [markup.goldmark.renderer]
    unsafe = false
  [markup.goldmark.renderHooks.link]
    # Keep Markdown links exactly as written (e.g. ../../#otel). Hugo's built-in hook would turn
    # them into /neurons/... root-relative links.
    useEmbedded = "never"

[markup.highlight]
  # Plain <pre><code> for fenced blocks: Chroma's default output uses inline style
  # attributes, which the Content-Security-Policy (style-src 'self') would block.
  codeFences = false

[minify.tdewolff.html]
  keepWhitespace = false
